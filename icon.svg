<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- WW2 Air Battles: Оборона аэродрома — иконка приложения.
       Плоский вектор (GDD «Art direction»): небо #8fa6b2, Ла-5 оливковый #4a5d3a
       с кремовым контуром #d9d2c3. Силуэт — ArtStyle._la5_outline(), нос вверх. -->
  <rect width="512" height="512" fill="#8fa6b2"/>
  <g fill="#d9d2c3" opacity="0.10">
    <ellipse cx="96" cy="150" rx="120" ry="28"/>
    <ellipse cx="430" cy="372" rx="132" ry="32"/>
    <ellipse cx="210" cy="486" rx="150" ry="26"/>
  </g>
  <!-- Диск винта: вращающийся пропеллер перед носом. -->
  <ellipse cx="256" cy="78" rx="104" ry="9" fill="#d9d2c3" opacity="0.45"/>
  <!-- Ла-5: крылья, фюзеляж и оперение одним контуром. -->
  <polygon
    points="256,64 280,120 292,192 440,232 448,280 304,312 296,376 344,424 344,448 288,432 256,440 224,432 168,448 168,424 216,376 208,312 64,280 72,232 220,192 232,120"
    fill="#4a5d3a"
    stroke="#d9d2c3"
    stroke-width="16"
    stroke-linejoin="round"/>
  <!-- Кабина: кремовая точка, чтобы силуэт читался в мелком размере. -->
  <circle cx="256" cy="224" r="21" fill="#d9d2c3"/>
</svg>
