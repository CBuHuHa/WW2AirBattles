; ─────────────────────────────────────────────────────────────────────────────
; M8c2: release AAB для Google Play (gradle build). Preset.0 Android выше — debug APK,
; он не менялся: ручной прогон на эмуляторе идёт по-прежнему через него.
; Отличия от preset.0: gradle_build=true, export_format=1 (AAB), export_path=.aab,
; runnable=false (AAB нельзя запускать из редактора), из exclude_filter добавлены
; graphify-out/*, store/* и build/* — стор-документы и скриншоты не должны попадать
; в бандл. package/signed=true: подпись берётся из редакторских настроек
; (export/android/release_keystore); пока release keystore владельца не задан,
; Godot подписывает debug-ключом — для Play нужен настоящий upload key (см. store/README.md).
; ─────────────────────────────────────────────────────────────────────────────
[preset.1]

name="Android AAB"
platform="Android"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*, tools/*, __pycache__/*, .opencode/*, opencode*.json, assets/opencode*.json, *.md, *.ica, scenes/juice_lab.tscn*, scripts/juice/juice_lab.gd*, assets/art/source/*, graphify-out/*, store/*, build/*"
export_path="build/ww2airbattles-release.aab"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

