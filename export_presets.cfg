; Release-подпись (2026-10-28). Пароль НЕ хранится в репозитории: в пресете стоит
; placeholder __RELEASE_PASSWORD__, tools/build_release.ps1 подставляет его из
; %USERPROFILE%\.android-keys\ww2airbattles-release.credentials.txt на время сборки
; и восстанавливает файл. Keystore и credentials лежат вне репозитория.
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release="C:/Users/cvin/.android-keys/ww2airbattles-release.keystore"
keystore/release_user="ww2airbattles"
keystore/release_password="__RELEASE_PASSWORD__"

