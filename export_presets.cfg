[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
; RC-1: dev-файлы не должны попадать в сборку прототипа.
; Godot сопоставляет глобы (через запятую) с путями res://, `*` покрывает и `/`.
; Исключаем: тесты, генераторы ассетов, метаданные агентов/документацию, кэш Python.
exclude_filter="tests/*, tools/*, __pycache__/*, .opencode/*, opencode*.json, assets/opencode*.json, *.md, *.ica, scenes/juice_lab.tscn*, scripts/juice/juice_lab.gd*, assets/art/source/*, graphify-out/*"
export_path="build/ww2airbattles-debug.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

